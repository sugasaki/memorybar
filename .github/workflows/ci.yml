name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      # 公式Actionはセキュリティ修正を取り込めるメジャータグで追従する
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift build
      # テストには実機サンプリング検証とMachポートリークの回帰テストを含む
      - run: swift test
      - name: 実機サンプリングのスモークテスト
        run: swift run truemem --print
      - name: .appバンドル生成と検証
        run: |
          APP_VERSION=0.1.0 APP_BUILD=1 scripts/make-app.sh
          plutil -lint "dist/TrueMem.app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "dist/TrueMem.app/Contents/Info.plist")" = "0.1.0"
          test "$(plutil -extract CFBundleVersion raw -o - "dist/TrueMem.app/Contents/Info.plist")" = "1"
          codesign --verify --deep --strict "dist/TrueMem.app"
          # --verify はシールの整合性しか見ないため、署名の存在自体も確認する
          codesign -dv --verbose=4 "dist/TrueMem.app"
