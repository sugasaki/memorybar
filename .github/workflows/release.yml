name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "明示するバージョン(例 1.0.0)。空なら直近タグのパッチを進める"
        required: false
        type: string

# latest リリースの作成・更新に必要
permissions:
  contents: write

# 連続 push でリリースの削除・再作成が競合しないよう直列化する
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          # タグからバージョンを決めるため、履歴とタグをすべて取得する
          fetch-depth: 0

      - name: 次のバージョンを決める
        id: version
        run: |
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            # メジャー・マイナーを上げたいときは、手動実行で明示する。
            # タグを後から打っても、このワークフローはブランチへの push でしか
            # 起動しないため確実に反映されない
            version="${requested#v}"
            echo "指定されたバージョン v$version を使用します"
          else
            # 同じコミットに複数のタグが付いていても結果が変わらないよう、
            # バージョンとして最も大きいものを選ぶ
            exact="$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)"
            if [ -n "$exact" ]; then
              version="${exact#v}"
              echo "このコミットのタグ $exact を使用します"
            else
              latest="$(git tag --list 'v[0-9]*' | sort -V | tail -1)"
              latest="${latest:-v0.0.0}"
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="${major}.${minor}.$((patch + 1))"
              echo "$latest → v$version"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: バージョンのタグを打つ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # ビルドより先に打つ。途中で中断されてもタグが残るため、
          # 次の実行が同じ番号を再利用せず、番号が単調に進む
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag は既にあります"
          else
            gh api --method POST /repos/${{ github.repository }}/git/refs \
              -f ref="refs/tags/$tag" -f sha="${{ github.sha }}" \
              && echo "$tag を作成しました"
          fi

      - name: Universal バイナリで .app を生成
        env:
          # 更新判定はこのコミットSHAで行う
          APP_COMMIT: ${{ github.sha }}
          UNIVERSAL: "1"
          APP_VERSION: ${{ steps.version.outputs.version }}
          # ビルド番号は実行回数を使う
          APP_BUILD: ${{ github.run_number }}
        run: scripts/make-app.sh

      - name: Universal になっていることを確認
        run: |
          lipo -archs dist/TrueMem.app/Contents/MacOS/truemem | tee /tmp/archs
          grep -q arm64 /tmp/archs
          grep -q x86_64 /tmp/archs

      - name: 埋め込みコミットSHAを確認
        run: |
          embedded=$(/usr/libexec/PlistBuddy -c "Print :TMSourceCommit" dist/TrueMem.app/Contents/Info.plist)
          echo "embedded=$embedded"
          test "$embedded" = "${{ github.sha }}"
          # バージョンが意図した値で埋め込まれているか
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/TrueMem.app/Contents/Info.plist)
          echo "version=$version"
          test "$version" = "${{ steps.version.outputs.version }}"

      - name: zip に固める
        run: ditto -c -k --keepParent dist/TrueMem.app dist/TrueMem.zip

      - name: latest リリースを作り直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          **v${{ steps.version.outputs.version }}** (\`${GITHUB_SHA}\` からの自動ビルド)

          [TrueMem.zip](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/TrueMem.zip) をダウンロードし、展開して \`TrueMem.app\` を \`/Applications\` に置いてください。

          Apple Silicon と Intel の両方で動作する Universal ビルドです。ad-hoc 署名のため、初回起動時のみ手動での許可が必要です(README を参照)。
          EOF

          # GitHub API は「タグが既存なら target_commitish を無視する」ため、
          # edit では更新先コミットが古いまま残る。アプリの更新判定が
          # 永久に一致しなくなるので、タグごと削除して作り直す。
          #
          # 削除は結果を問わない。API が一時的に "release not found" を返して
          # 失敗した実例があり、消えていないなら次の create が弾いてくれる
          gh release delete latest --yes --cleanup-tag || echo "削除をとばしました"

          # 資産を create と同時に添付し、「新しいメタデータ + 古い zip」を
          # 掴む隙間を作らない。
          # API の一時的な不調で落ちないよう数回試す
          for attempt in 1 2 3; do
            if gh release create latest \
              --title "Latest build" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              --latest \
              dist/TrueMem.zip
            then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "リリースの作成に3回失敗しました"
              exit 1
            fi
            echo "作成に失敗。${attempt}回目、10秒後に再試行します"
            sleep 10
            # 中途半端に作られていたら消してからやり直す
            gh release delete latest --yes --cleanup-tag || true
          done

      - name: リリースが今回のコミットを指していることを確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(gh release view latest --json targetCommitish --jq .targetCommitish)
          echo "target=$target"
          test "$target" = "${{ github.sha }}"
